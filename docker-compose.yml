services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: muchtodo
      ENABLE_CACHE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - muchtodo-network

  mongodb:
    image: mongo:7.0
    container_name: muchtodo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - muchtodo-network

volumes:
  mongodb_data:

networks:
  muchtodo-network:
    driver: bridge